services:
  manager-db:
    image: postgres:15-alpine
    container_name: manager-db
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - manager-network

volumes:
  postgres_data:

networks:
  manager-network:
    driver: bridge